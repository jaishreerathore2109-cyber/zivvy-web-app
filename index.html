<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Zivvy</title><link rel="stylesheet" href="style.css"></head><body>
<header><a class="brand-logo" href="#"><img src="logo.png" alt="Zivvy logo"><span>Zivvy</span></a><input id="search" placeholder="Search posts"><nav><button id="home">⌂</button><button id="new">＋</button><button id="msg">✉</button><button id="theme">☾</button><button id="logout" hidden>Logout</button></nav></header>
<main><section id="auth" class="card"><h1>Welcome to Zivvy 💜</h1><p>Create an account or log in.</p><form id="authForm"><input id="email" type="email" placeholder="Email" required><input id="password" type="password" placeholder="Password" minlength="6" required><input id="username" placeholder="Username for sign up"><button class="primary">Continue</button></form><p id="authMsg"></p></section>
<section id="app" hidden><div id="feed"></div></section></main>
<div id="modal" hidden><div class="modalBox"><button id="close">×</button><h2>Create post</h2><textarea id="text" placeholder="Share something..."></textarea><input id="image" placeholder="Optional image URL"><button id="publish" class="primary">Publish</button><p id="postMsg"></p></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="app.js"></script></body></html>
